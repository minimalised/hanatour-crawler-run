name: "[동기화] 드라이브 최신 엑셀 -> 판매상품리스트 이관"

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 한국시간 09:00
  workflow_dispatch:     # 수동 실행

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-api-python-client openpyxl

      - name: Run Sync Script
        env:
          GOOGLE_JSON_RAW: ${{ secrets.GOOGLE_JSON_RAW }}
          TARGET_SPREADSHEET_ID: ${{ secrets.TARGET_SPREADSHEET_ID }}
        run: |
          python sync_products.py
