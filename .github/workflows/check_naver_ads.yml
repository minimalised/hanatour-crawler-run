name: "[점검] 기획전 랜딩페이지 상태 확인"

on:
  schedule:
    # UTC 기준 매일 23:00 (한국시간 오전 08:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  check-landing-urls:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Landing Check Script
      env:
        GOOGLE_JSON_RAW: ${{ secrets.GOOGLE_JSON_RAW }}
        NAVER_API_LICENSE_KEY: ${{ secrets.NAVER_API_LICENSE_KEY }}
        NAVER_API_SECRET_KEY: ${{ secrets.NAVER_API_SECRET_KEY }}
        NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
        TARGET_SPREADSHEET_ID: ${{ secrets.TARGET_SPREADSHEET_ID }}
      run: |
        python scripts/check_naver_ads.py
